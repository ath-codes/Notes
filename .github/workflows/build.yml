name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Unzip project
        run: |
          ZIP=$(ls *.zip | head -n 1)
          mkdir -p _proj
          unzip -q -o "$ZIP" -d _proj
          SETTINGS=$(find _proj \( -name settings.gradle.kts -o -name settings.gradle \) | head -n 1)
          echo "ROOT=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: cd "$ROOT" && gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: QuickNotes-apk
          path: ${{ env.ROOT }}/app/build/outputs/apk/debug/*.apk
